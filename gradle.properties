# 하위 Android용 역호환 변환과 Lint를 함께 수행할 때의 메모리 압박을 줄입니다.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# IDE에서 Gradle을 직접 실행하는 경우에도 프로젝트 캐시를 도구 폴더에 둡니다.
org.gradle.projectcachedir=.tools/.gradle

# Kotlin의 프로젝트 상태와 컴파일 오류 기록도 도구 폴더에 저장합니다.
kotlin.project.persistent.dir=.tools/.kotlin
# 별도 컴파일 데몬의 사용자 프로필 임시 경로 대신 Gradle 프로세스에서 컴파일합니다.
kotlin.compiler.execution.strategy=in-process

